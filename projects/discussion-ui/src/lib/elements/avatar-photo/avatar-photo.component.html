<div [ngClass]="{'circle-s' : size=== 's',
'circle-m' : size=== 'm',
'circle-l' : size=== 'l',
'circle-xl' : size=== 'xl',
'circle-xxl' : size=== 'xxl',
'circle-xl-s' : size=== 'xl-s',
'circle-xxl-s': size=== 'xxl-s'}" [ngStyle]="{'background-color':  circleColor }">
  @if (!showInitials) {
    <img src="{{photoUrl}}" [alt]="photoUrl? '' :(name || initials || size || random)">
  }

  @if (showInitials) {
    <div class="initials" i18n-aria-label>
      {{ initials }}
    </div>
  }
</div>
