<div class="flex flex-row justify-between margin-bottom-l">
  <div class="recent-tabs">
    <div class="tabs-content">
      <div class="tabs-filter">
        <a role="button" class="filter-option df-filter-option tabs-active" id="most-karma">
        All </a>
        <a role="button" class="filter-option df-filter-option" id="top-poster">
        Watching </a>

      </div>
    </div>
  </div>

  <!-- <div class="discuss-home text-white flex items-center justify-center cursor-pointer mat-subheading-2 margin-remove"> Start discussion </div> -->
</div>

<div class="discuss-category-cards">
  @for (data of categories; track data) {
    <div (click)="navigateToDiscussionPage(data?.cid, data?.slug);logTelemetry($event)" class="categories-card-content" id="category-card">
      <lib-category-card [category]="data" class="card-comp"></lib-category-card>
    </div>
  }
</div>

@if (showStartDiscussionModal) {
  <lib-discuss-start (close)="closeModal($event)" [categoryId]="categoryId"></lib-discuss-start>
}
